<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lemon Studio</title>
<meta name="theme-color" content="#1c1c1c">
<link rel="icon" href="assets/lemon-icon.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/logo.css">
<link rel="stylesheet" href="css/nav-link.css">
<link rel="stylesheet" href="css/mid-bar.css">
<link rel="stylesheet" href="css/search-box.css">
<link rel="stylesheet" href="css/hamburger.css">
<link rel="stylesheet" href="css/settings-panel.css">
<link rel="stylesheet" href="css/auth-buttons.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/back-to-top.css">
</head>
<body>

<div id="pageShell" class="page-shell">

  <header class="site-header" id="siteHeader" data-scroll-hide>
    <div class="header-right">
      <button type="button" class="auth-btn">
        <span data-i18n="auth.login">Entrar</span>
        <span class="auth-btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        </span>
      </button>

      <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>

      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" data-i18n-placeholder="search.placeholder" placeholder="Pesquisar..." autocomplete="off">
      </label>
    </div>
  </header>

  <!-- Barra do meio da tela (abaixo do centro): 6 opções, todas "em breve" por enquanto -->
  <nav class="mid-bar" id="midBar" data-scroll-hide>
    <button type="button" class="nav-link mid-item"><span data-i18n="mid.soon">Em breve</span></button>
    <button type="button" class="nav-link mid-item"><span data-i18n="mid.soon">Em breve</span></button>
    <button type="button" class="nav-link mid-item"><span data-i18n="mid.soon">Em breve</span></button>
    <button type="button" class="nav-link mid-item"><span data-i18n="mid.soon">Em breve</span></button>
    <button type="button" class="nav-link mid-item"><span data-i18n="mid.soon">Em breve</span></button>
    <button type="button" class="nav-link mid-item"><span data-i18n="mid.soon">Em breve</span></button>
  </nav>

  <main style="min-height:calc(100svh - 80px);">
    <!-- conteúdo da home entra aqui nas próximas etapas -->
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-grid" data-in>
        <div class="footer-brand">
          <a href="#" class="logo">
            <img class="logo-icon" src="assets/lemon-icon.png" alt="" width="40" height="40">
            <span class="logo-text" style="font-size:26px;">Lemon<span class="accent">Studio</span></span>
          </a>
        </div>

        <div class="footer-social">
          <strong data-i18n="footer.followUs">Siga a gente</strong>
          <div class="footer-social-icons">
            <a href="https://discord.gg/lemon-studio-1422278971227115532" target="_blank" rel="noopener" aria-label="Discord">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><path d="M7 6.5c3.5-1 6.5-1 10 0 1.4 2.6 2 5.4 1.8 8.4-1.5 1.2-3 1.9-4.5 2.2l-.9-1.5c.8-.3 1.5-.6 2.2-1.1-.2-.1-.4-.3-.6-.4-3.2 1.5-6.8 1.5-10 0-.2.1-.4.3-.6.4.7.5 1.4.8 2.2 1.1L6 17.1c-1.5-.3-3-1-4.5-2.2C1.3 11.9 1.9 9.1 3.3 6.5"/></svg>
            </a>
            <a href="https://github.com/Lemon-Studio-Official/Home" target="_blank" rel="noopener" aria-label="GitHub">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
            </a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <span>© <span id="footerYear">2026</span> <span data-i18n="footer.rights">Lemon Studio. Todos os direitos reservados.</span></span>
        <span data-i18n="footer.madeWith">Feito com bastante limão.</span>
      </div>
    </div>
  </footer>

</div>

<!-- Menu hambúrguer: tela cheia, direita -> esquerda. Idioma e Tema ficam aqui. -->
<div class="hamburger-panel" id="hamburgerPanel">
  <button type="button" class="hamburger-panel-close" id="hamburgerClose" aria-label="Fechar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>

  <div class="settings">
    <section class="settings-group">
      <h2 data-i18n="nav.language">Idioma</h2>
      <div class="settings-options" id="langOptions"></div>
    </section>

    <section class="settings-group">
      <h2 data-i18n="theme.title">Tema</h2>
      <div class="settings-options two" id="themeOptions">
        <button type="button" class="settings-option" data-theme-option="light">
          <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
          <span data-i18n="theme.light">Claro</span>
        </button>
        <button type="button" class="settings-option" data-theme-option="dark">
          <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></span>
          <span data-i18n="theme.dark">Escuro</span>
        </button>
      </div>
    </section>
  </div>
</div>

<button type="button" class="back-to-top" id="backToTop" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="js/i18n.js" defer></script>
<script src="js/lang-switcher.js" defer></script>
<script src="js/hamburger.js" defer></script>
<script src="js/header-scroll.js" defer></script>
<script src="js/back-to-top.js" defer></script>
<script src="js/reveal.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
